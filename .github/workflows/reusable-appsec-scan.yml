name: Reusable AI AppSec Scan

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  scan:
    name: AI AppSec scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Trusted scanner code is checked out separately from the repository being scanned.
      - name: Check out scanner
        uses: actions/checkout@v4
        with:
          repository: rohitkrchandoliya/ai-appsec-platform
          ref: main
          path: scanner
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked scanner dependencies
        working-directory: scanner
        run: |
          python -m pip install uv==0.13.0
          uv sync --locked --all-extras

      - name: Check out pull request base revision as data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: target-base
          persist-credentials: false

      # The target repository is data only: never run its scripts, tests, or build hooks.
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false

      - name: Scan base revision
        id: scan_base
        continue-on-error: true
        working-directory: scanner
        run: uv run --locked appsec scan ../target-base --sarif > ../base-results.sarif

      - name: Scan pull request revision
        id: scan_head
        continue-on-error: true
        working-directory: scanner
        run: uv run --locked appsec scan ../target --sarif > ../head-results.sarif

      - name: Compare base and pull request findings
        id: compare
        working-directory: scanner
        env:
          BASE_SCAN_OUTCOME: ${{ steps.scan_base.outcome }}
          HEAD_SCAN_OUTCOME: ${{ steps.scan_head.outcome }}
        run: uv run --locked python -m appsec.ci_delta ../base-results.sarif ../head-results.sarif ../appsec-new-findings.sarif
      - name: Emit workflow annotations
        if: always() && hashFiles('appsec-new-findings.sarif') != ''
        env:
          APPSEC_ANNOTATION_PATH_PREFIX: target
        working-directory: scanner
        run: uv run --locked python -m appsec.ci_report ../appsec-new-findings.sarif

      - name: Publish dedicated GitHub check run
        if: always() && github.event_name == 'pull_request_target' && hashFiles('appsec-new-findings.sarif') != ''
        uses: actions/github-script@v7
        env:
          SARIF_PATH: appsec-new-findings.sarif
          SCAN_OUTCOME: ${{ steps.compare.outcome }}
        with:
          script: |
            const fs = require('fs');
            let reportValid = false;
            let total = 0;
            const counts = { error: 0, warning: 0, note: 0, other: 0 };
            let parseProblem = 'SARIF report was not produced.';
            if (fs.existsSync(process.env.SARIF_PATH)) {
              try {
                const sarif = JSON.parse(fs.readFileSync(process.env.SARIF_PATH, 'utf8'));
                const results = (sarif.runs || []).flatMap(run => run.results || []);
                total = results.length;
                for (const result of results) {
                  const level = result.level || 'warning';
                  if (Object.prototype.hasOwnProperty.call(counts, level)) counts[level] += 1;
                  else counts.other += 1;
                }
                reportValid = true;
              } catch (error) {
                parseProblem = 'SARIF report exists but could not be parsed as valid JSON.';
              }
            }
            const conclusion = process.env.SCAN_OUTCOME === 'success' && reportValid ? 'success' : 'failure';
            const summary = [
              '## AI AppSec security gate',
              '',
              reportValid ? 'SARIF report parsed successfully. **' + total + ' finding(s)** reported.' : parseProblem,
              '',
              '- Error: ' + counts.error,
              '- Warning: ' + counts.warning,
              '- Note: ' + counts.note,
              '- Other levels: ' + counts.other,
              '',
              process.env.SCAN_OUTCOME === 'success' ? 'No new high/critical findings were introduced compared with the trusted base revision.' : 'The base/head scan or finding comparison failed, or new high/critical findings were introduced. Review annotations and the SARIF artifact.'
            ].join('\n');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AI AppSec Security Gate',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: conclusion,
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              output: {
                title: conclusion === 'success' ? 'Security gate passed' : 'Security gate failed',
                summary: summary
              }
            });

      - name: Upload SARIF artifact
        if: always() && hashFiles('appsec-new-findings.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-appsec-sarif
          path: appsec-new-findings.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Enforce severity gate
        if: steps.compare.outcome == 'failure'
        run: exit 1
