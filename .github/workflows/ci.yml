name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.0
          uv sync --locked --all-extras

      - name: Lint
        run: uv run --locked ruff check .

      - name: Tests
        run: uv run --locked pytest

      - name: Type check
        run: uv run --locked mypy appsec

      - name: Audit Python dependencies
        run: |
          uv pip install --python .venv/bin/python pip-audit==2.10.1
          .venv/bin/pip-audit --skip-editable

      - name: Scan pull request changes for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit full Git history for secrets
        run: |
          GITLEAKS_BIN="$(find /tmp/gitleaks-* -maxdepth 1 -type f -name gitleaks -perm -111 -print -quit 2>/dev/null || true)"
          test -n "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" detect --source . --redact --exit-code 1 --log-opts="--all"

      - name: Build production Docker image
        run: docker build --pull --tag ai-appsec-platform:ci .

      - name: Smoke-test Docker CLI as non-root
        run: |
          docker run --rm ai-appsec-platform:ci version
          test "$(docker image inspect ai-appsec-platform:ci --format '{{.Config.User}}')" = "10001:10001"
