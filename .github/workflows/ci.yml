name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Type check
        run: mypy appsec

      - name: Build production Docker image
        run: docker build --pull --tag ai-appsec-platform:ci .

      - name: Smoke-test Docker CLI as non-root
        run: |
          docker run --rm ai-appsec-platform:ci version
          test "$(docker image inspect ai-appsec-platform:ci --format '{{.Config.User}}')" = "10001:10001"
