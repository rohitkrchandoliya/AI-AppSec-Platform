[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-appsec-platform"
version = "0.1.0"
description = "AI-assisted application security analysis platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rohit Kumar Chandoliya"}]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "rich>=13.9,<14"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.13,<2"
]

[project.scripts]
appsec = "appsec.cli:app"
appsec-api = "appsec.api:main"

[tool.setuptools.packages.find]
include = ["appsec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.package-data]
appsec = ["web/*.html", "web/*.css", "web/*.js"]
